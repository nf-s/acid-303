<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 662 100"
  overflow="visible"
  aria-hidden="true"
>
  <style>
    .fluff-wordmark-still {
      display: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .fluff-wordmark-live {
        display: none;
      }
      .fluff-wordmark-still {
        display: inline;
      }
    }
  </style>
  <defs>
    <filter
      id="fluff-letter-drift"
      x="-40"
      y="-40"
      width="742"
      height="180"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.03"
        numOctaves="1"
        seed="5"
        result="drift"
      >
        <animate
          attributeName="baseFrequency"
          values="0.012 0.03;0.016 0.024;0.012 0.03"
          dur="14s"
          repeatCount="indefinite"
        />
      </feTurbulence>
      <feDisplacementMap
        in="SourceGraphic"
        in2="drift"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
        result="drifted"
      >
        <animate
          attributeName="scale"
          values="3;6;3"
          dur="9s"
          repeatCount="indefinite"
        />
      </feDisplacementMap>
      <feDisplacementMap
        class="fluff-letter-billow"
        in="drifted"
        in2="drift"
        scale="0"
        xChannelSelector="G"
        yChannelSelector="R"
      />
    </filter>
    <filter
      id="fluff-letter-shadow"
      x="-40"
      y="-40"
      width="742"
      height="190"
      filterUnits="userSpaceOnUse"
    >
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <linearGradient
      id="fluff-letter-belly"
      x1="0"
      y1="8"
      x2="0"
      y2="96"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0.35" style="stop-color: var(--fluff-palette-light, #f4c0de)" stop-opacity="0" />
      <stop offset="1" style="stop-color: var(--fluff-palette-mid, #f4c0de)" stop-opacity="0.75" />
    </linearGradient>
