  <style>
    .fluff-wordmark-letter {
      animation: fluff-wordmark-float 5.2s ease-in-out infinite;
    }
    .fluff-wordmark-letter:nth-of-type(2) {
      animation-delay: -1s;
    }
    .fluff-wordmark-letter:nth-of-type(3) {
      animation-delay: -2s;
    }
    .fluff-wordmark-letter:nth-of-type(4) {
      animation-delay: -3s;
    }
    .fluff-wordmark-letter:nth-of-type(5) {
      animation-delay: -4s;
    }
    @keyframes fluff-wordmark-float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .fluff-wordmark-letter {
        animation: none;
      }
    }
  </style>
  <defs>
