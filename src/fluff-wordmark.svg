    <mask
      id="fluff-letter-mask"
      x="-40"
      y="-40"
      width="742"
      height="180"
      maskUnits="userSpaceOnUse"
    >
      <use href="#fluff-letter-puffs" fill="#fff" />
    </mask>
    <filter
      id="fluff-letter-soften"
      x="-40"
      y="-40"
      width="742"
      height="180"
      filterUnits="userSpaceOnUse"
    >
      <feGaussianBlur stdDeviation="0.9" />
    </filter>
    <g id="fluff-cloud-letters">
      <use
        href="#fluff-letter-puffs"
        fill="currentColor"
        opacity="0.3"
        filter="url(#fluff-letter-shadow)"
        transform="translate(0 5)"
      />
      <use
        class="fluff-letter-halo"
        href="#fluff-letter-puffs"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="4.5"
        opacity="0.4"
        filter="url(#fluff-letter-soften)"
      />
      <use href="#fluff-letter-puffs" fill="#fff" />
      <rect
        class="fluff-letter-belly"
        x="-40"
        y="-40"
        width="742"
        height="180"
        fill="url(#fluff-letter-belly)"
        mask="url(#fluff-letter-mask)"
      />
